plugins {
    id 'com.android.application'
}

// Release signing is configured out-of-band so the keystore and its passwords
// never live in the repository. Set these in ~/.gradle/gradle.properties or as
// environment variables; release builds fall back to unsigned when absent.
def releaseStorePath = System.getenv('BUDGETAPP_STORE_FILE') ?: project.findProperty('budgetapp.storeFile')

android {
    namespace 'com.andrewovens.weeklybudget2'
    compileSdk 37

    defaultConfig {
        applicationId "com.andrewovens.weeklybudget2"
        minSdk 23
        targetSdk 37
        // Must stay above the highest version code already on Play. 5.1.0
        // (code 32) went live on 14 Aug 2026, so this release is 33.
        versionCode 33
        versionName "6.0.0"

        vectorDrawables.useSupportLibrary = true

        buildConfigField 'String', 'API_BASE_URL', '"https://budget.andrewovens.com/api/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    if (releaseStorePath) {
        signingConfigs {
            release {
                storeFile file(releaseStorePath)
                storePassword System.getenv('BUDGETAPP_STORE_PASSWORD') ?: project.findProperty('budgetapp.storePassword')
                keyAlias System.getenv('BUDGETAPP_KEY_ALIAS') ?: project.findProperty('budgetapp.keyAlias')
                keyPassword System.getenv('BUDGETAPP_KEY_PASSWORD') ?: project.findProperty('budgetapp.keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStorePath) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'

            // Points at a mock API on the host (10.0.2.2 is the emulator's
            // route to it), so the sync can be exercised without touching the
            // live server. Override with -Pbudgetapp.debugApiUrl=... , or set
            // it to the production URL to debug against real data.
            buildConfigField 'String', 'API_BASE_URL',
                    "\"${project.findProperty('budgetapp.debugApiUrl') ?: 'http://10.0.2.2:8099/api/'}\""
        }
    }

    lint {
        warningsAsErrors true
        checkDependencies true
        // MPAndroidChart 3.1.0 is the last upstream release and still ships an
        // older minSdk/target; nothing we can act on from here.
        disable 'GradleDependency', 'ObsoleteLintCustomCheck'
        abortOnError true
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }
}

// Pins the JDK that compiles the project, so the build does not depend on
// whichever JVM happens to be on PATH. compileOptions above still decides the
// bytecode level that ships in the APK.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub that throws; the real implementation
    // takes precedence on the unit-test classpath.
    testImplementation 'org.json:json:20250517'
}
